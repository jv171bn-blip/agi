<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Painel Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #080c14;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#111726] border border-[#1e2c45] rounded-2xl p-8 shadow-2xl space-y-6">
        
        <!-- Topo: Logo & Título -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-blue-500/20">
                ⚡
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">Painel Operacional</h1>
            <p class="text-xs text-slate-400">Entre com suas credenciais de atendente ou gestor</p>
        </div>

        <!-- Alerta de Erro / Limite de PC -->
        <div id="errorAlert" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-start space-x-2">
            <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span id="errorMessage">Mensagem de erro</span>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Usuário</label>
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="Digite seu usuário (ex: admin)" 
                    required 
                    autocomplete="username"
                    value="admin"
                    class="w-full bg-[#090e18] border border-[#1e2c45] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Senha</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Digite sua senha (ex: admin)" 
                    required 
                    autocomplete="current-password"
                    value="admin"
                    class="w-full bg-[#090e18] border border-[#1e2c45] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-blue-900/40 cursor-pointer"
            >
                Entrar no Painel
            </button>
        </form>

        <div class="pt-2 text-center text-[11px] text-slate-500 flex items-center justify-center space-x-1">
            <svg class="w-3.5 h-3.5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"/>
            </svg>
            <span>Autenticação & Trava de PCs Conectada ao Supabase</span>
        </div>

    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (Usando sbClient para nunca colidir com a variável global)
        const SUPABASE_URL = 'https://tqtomvxlydliavtcoint.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_giwMPo6de1ym25RqVRPRgQ_U8g_i1QH';
        
        let sbClient = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else if (typeof supabase !== 'undefined' && typeof supabase.createClient === 'function') {
                sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error('Erro ao iniciar Supabase:', e);
        }

        // Identificador persistente da máquina no navegador
        function getDeviceId() {
            let deviceId = localStorage.getItem('pc_device_id');
            if (!deviceId) {
                deviceId = 'pc_' + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
                localStorage.setItem('pc_device_id', deviceId);
            }
            return deviceId;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('errorAlert');
            const msgEl = document.getElementById('errorMessage');

            alertBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = 'Validando Acesso...';

            try {
                // Fallback direto via fetch REST se a SDK não tiver inicializado
                let opData = null;
                if (sbClient) {
                    const { data, error } = await sbClient
                        .from('operadores')
                        .select('*')
                        .eq('usuario', user)
                        .eq('senha', pass)
                        .eq('ativo', true)
                        .maybeSingle();

                    if (error) throw error;
                    opData = data;
                } else {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/operadores?usuario=eq.${encodeURIComponent(user)}&senha=eq.${encodeURIComponent(pass)}&ativo=eq.true&select=*`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    const rows = await res.json();
                    if (rows && rows.length > 0) opData = rows[0];
                }

                if (!opData) {
                    throw new Error('Usuário ou senha incorretos.');
                }

                const deviceId = getDeviceId();
                const userAgent = navigator.userAgent;

                // Se for Master (admin), libera direto sem travar por limite de PC
                if (opData.cargo === 'master') {
                    salvarSessao(opData.usuario, opData.cargo);
                    window.location.href = 'admin.html';
                    return;
                }

                // Verifica limite de PCs para Operador comum
                const devRes = await fetch(`${SUPABASE_URL}/rest/v1/operadores_dispositivos?usuario=eq.${encodeURIComponent(user)}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                const existingDevices = await devRes.json();
                const currentDevice = Array.isArray(existingDevices) ? existingDevices.find(d => d.device_id === deviceId) : null;

                if (currentDevice) {
                    // Já é uma máquina conhecida deste operador: libera
                    salvarSessao(opData.usuario, opData.cargo);
                    window.location.href = 'admin.html';
                    return;
                }

                // É um PC novo tentando entrar: checa se ainda tem vagas
                const totalAtivos = Array.isArray(existingDevices) ? existingDevices.length : 0;
                const limiteMax = opData.limite_pcs || 3;

                if (totalAtivos >= limiteMax) {
                    throw new Error(`Limite de PCs atingido (${totalAtivos}/${limiteMax}). Solicite ao administrador a liberação de mais vagas ou a revogação de uma máquina antiga.`);
                }

                // Tem vaga: registra a nova máquina
                await fetch(`${SUPABASE_URL}/rest/v1/operadores_dispositivos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        usuario: user,
                        device_id: deviceId,
                        user_agent: userAgent,
                        status: 'ativo'
                    })
                });

                salvarSessao(opData.usuario, opData.cargo);
                window.location.href = 'admin.html';

            } catch (err) {
                console.error(err);
                msgEl.innerText = err.message || 'Falha na conexão com o servidor.';
                alertBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Entrar no Painel';
            }
        }

        function salvarSessao(usuario, cargo) {
            sessionStorage.setItem('admin_user', usuario);
            sessionStorage.setItem('admin_role', cargo);
            sessionStorage.setItem('admin_logged_at', Date.now().toString());
        }
    </script>
</body>
</html>
