<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #080c14;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
        }
        .domain-label {
            font-size: 15px;
            letter-spacing: 1.5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <span class="domain-label" id="domainDisplay"></span>

    <script>
        const host = (window.location.hostname && window.location.hostname !== "" && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") 
            ? window.location.hostname 
            : "facilitasolucoescontract.online";
        document.getElementById('domainDisplay').innerText = host;
        document.title = host;
    </script>
</body>
</html>
